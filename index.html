<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0a0820"><title>Winter Arc</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0820;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.09);--txt:#f1f5ff;--mut:#a5b0d6;--ice:#38bdf8;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24;
 --grad:linear-gradient(135deg,#22d3ee 0%,#8b5cf6 55%,#ec4899 100%);--glow:0 6px 22px rgba(139,92,246,.45)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Outfit',system-ui,-apple-system,Roboto,sans-serif}
html{background:radial-gradient(ellipse at 85% 0%,#2e1065 0%,transparent 55%),radial-gradient(ellipse at 0% 100%,#082f49 0%,transparent 55%),var(--bg);background-attachment:fixed;min-height:100%}
body{color:var(--txt);padding-bottom:110px;-webkit-tap-highlight-color:transparent;min-height:100vh;position:relative;overflow-x:hidden}
body::before,body::after{content:'';position:fixed;z-index:-1;width:110vw;height:110vw;max-width:800px;max-height:800px;border-radius:50%;opacity:.55;pointer-events:none;animation:drift 20s ease-in-out infinite alternate}
body::before{top:-40vw;left:-40vw;background:radial-gradient(circle,rgba(124,58,237,.55),transparent 62%)}
body::after{bottom:-45vw;right:-45vw;background:radial-gradient(circle,rgba(14,165,233,.45),transparent 62%);animation-delay:-10s}
@keyframes drift{to{transform:translate(14vw,10vh) scale(1.2)}}
@keyframes shine{to{background-position:300% 0}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* header */
header{padding:22px 18px 8px}
h1{font-size:25px;font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#67e8f9,#a78bfa,#f472b6,#67e8f9);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
.sub{color:var(--mut);font-size:13px}
#lvl:not(:empty){background:var(--grad);color:#fff;padding:5px 11px;border-radius:99px;font-weight:700;font-size:12px;box-shadow:var(--glow);white-space:nowrap}
#syn{font-size:14px}
#dayc{margin-top:8px;font-weight:600;font-size:14px;color:#c7d2fe}
.quote{font-style:italic;color:#e0e7ff;font-size:14px;margin-top:12px;padding:11px 14px;border-radius:14px;background:rgba(255,255,255,.05);border-left:3px solid #a78bfa}

/* layout */
main{padding:12px 14px}
.card{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 12px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden;animation:pop .35s ease both}
.card::before{content:'';position:absolute;top:0;left:20px;right:20px;height:2px;background:var(--grad);opacity:.85;border-radius:2px}
.card h3{font-size:16px;font-weight:800;margin-bottom:12px;letter-spacing:.2px}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>.card{margin-bottom:14px}

/* inputs */
input,select{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--txt);padding:12px 13px;border-radius:14px;font-size:15px;margin-bottom:9px;color-scheme:dark;outline:none;transition:.2s}
input:focus,select:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(139,92,246,.25);background:rgba(255,255,255,.09)}
input::placeholder{color:#7c86ad}
select option{background:#1b1640;color:#fff}

/* buttons */
button,.btnlike{background:var(--grad);color:#fff;border:0;padding:12px 16px;border-radius:14px;font-weight:800;font-size:15px;display:block;text-align:center;box-shadow:var(--glow);transition:transform .15s,box-shadow .2s,background .2s;cursor:pointer}
button:active,.btnlike:active{transform:scale(.95)}
button.g,.btnlike{background:rgba(255,255,255,.08);color:var(--txt);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
button.r{background:linear-gradient(135deg,#fb7185,#e11d48);color:#fff;box-shadow:0 6px 22px rgba(225,29,72,.4)}
.x{background:none!important;color:var(--mut)!important;padding:4px 8px;box-shadow:none!important;font-size:16px}
.big{font-size:58px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;margin:16px 0;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(139,92,246,.45))}

/* bottom nav */
nav{position:fixed;bottom:12px;left:12px;right:12px;display:flex;gap:4px;background:rgba(22,18,52,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:6px;box-shadow:0 14px 40px rgba(0,0,0,.55);z-index:5}
nav button{flex:1;background:none;color:var(--mut);border-radius:18px;padding:8px 0;font-size:11px;font-weight:700;box-shadow:none}
nav button.on{background:var(--grad);color:#fff;box-shadow:var(--glow)}
nav b{display:block;font-size:20px;margin-bottom:1px}

/* tabs */
.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px;padding:2px 2px 6px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;padding:9px 14px;font-size:13px;border-radius:99px}

/* bars */
.bar{height:10px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .5s ease;box-shadow:0 0 12px rgba(139,92,246,.55)}
.bar[style*="flex"] i{border-radius:0;box-shadow:none}

/* habits */
.habit{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);margin-bottom:8px;transition:.2s;cursor:pointer}
.habit:active{transform:scale(.98)}
.habit.done{background:linear-gradient(135deg,rgba(52,211,153,.2),rgba(34,211,238,.07));border-color:rgba(52,211,153,.35);color:var(--mut);text-decoration:line-through}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid #a78bfa;display:grid;place-items:center;font-weight:900;flex-shrink:0;transition:.2s}
.done .chk{background:linear-gradient(135deg,#34d399,#22d3ee);border-color:transparent;color:#05281c;box-shadow:0 0 14px rgba(52,211,153,.6)}

/* lists & text */
.li{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px}.li:last-child{border:0}
.mut{color:var(--mut);font-size:12px;letter-spacing:.2px}.pos{color:var(--ok)}.neg{color:var(--bad)}
.stat{font-size:25px;font-weight:900;text-shadow:0 0 24px rgba(167,139,250,.5)}
.stat.neg{text-shadow:0 0 20px rgba(251,113,133,.45)}

#toast{position:fixed;bottom:105px;left:50%;transform:translateX(-50%);background:var(--grad);color:#fff;padding:11px 20px;border-radius:99px;font-weight:800;opacity:0;transition:.3s;pointer-events:none;z-index:9;box-shadow:var(--glow);white-space:nowrap}

/* charts */
.chart{position:relative;height:160px;display:flex;align-items:flex-end;gap:6px;margin:24px 0 0}
.chart .col{flex:1;height:100%;display:flex;justify-content:center;align-items:flex-end;cursor:pointer}
.stack{width:70%;max-width:32px;min-height:3px;display:flex;flex-direction:column-reverse;border-radius:9px 9px 3px 3px;overflow:hidden;background:rgba(255,255,255,.07);transition:height .5s ease}
.stack i{display:block;width:100%}
.col.sel .stack{outline:2px solid #fff;outline-offset:2px;box-shadow:0 0 18px rgba(167,139,250,.7)}
.goal{position:absolute;left:0;right:0;border-top:1px dashed var(--warn);pointer-events:none}
.goal span{position:absolute;right:0;top:-16px;font-size:10px;color:var(--warn);font-weight:700}
.labels{display:flex;gap:6px}.labels small{flex:1;text-align:center;font-size:11px;color:var(--mut);margin-top:7px;cursor:pointer}
.labels small.on{color:#fff;font-weight:800}
.donut{width:124px;height:124px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;box-shadow:0 0 32px rgba(139,92,246,.35)}
.donut div{width:86px;height:86px;border-radius:50%;background:#17133a;display:grid;place-items:center;font-weight:900;font-size:15px;box-shadow:inset 0 0 12px rgba(0,0,0,.5)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.ycell{aspect-ratio:1;border-radius:2px;display:block}
.outbox{margin-top:12px;padding:16px;border-radius:16px;background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.12);text-align:center;color:var(--mut);font-size:13px}
</style></head><body>
<header><div class="row between"><h1>❄ WINTER ARC</h1><div class="sub row" style="gap:6px"><span id="lvl"></span><span id="syn"></span></div></div><div id="dayc"></div><div id="quote" class="quote"></div></header>
<main id="app"></main><div id="toast"></div>
<nav><button data-p="arc" onclick="go('arc')"><b>❄</b>Arc</button><button data-p="study" onclick="go('study')"><b id="nst">⏱</b>Study</button><button data-p="money" onclick="go('money')"><b>₹</b>Money</button><button data-p="more" onclick="go('more')"><b>⚙</b>More</button></nav>
