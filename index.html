<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#e6f0ff"><title>Winter Arc</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fc;--card:#ffffff;--line:#e4e9f3;--txt:#1d2340;--mut:#6b7492;--ice:#0ea5e9;--ok:#10b981;--bad:#f43f5e;--warn:#f59e0b;--acc:#4f46e5;
 --grad:linear-gradient(135deg,#0ea5e9 0%,#6366f1 100%);--glow:0 6px 18px rgba(79,70,229,.22)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Outfit',system-ui,-apple-system,Roboto,sans-serif}
html{background:linear-gradient(180deg,#e6f0ff 0%,#f3f1ff 45%,#fdf5f9 100%);background-attachment:fixed;min-height:100%}
body{color:var(--txt);padding-bottom:110px;-webkit-tap-highlight-color:transparent;min-height:100vh;position:relative;overflow-x:hidden}
body::before,body::after{content:'';position:fixed;z-index:-1;width:90vw;height:90vw;max-width:600px;max-height:600px;border-radius:50%;pointer-events:none}
body::before{top:-35vw;right:-30vw;background:radial-gradient(circle,rgba(99,102,241,.16),transparent 65%)}
body::after{bottom:-35vw;left:-30vw;background:radial-gradient(circle,rgba(14,165,233,.16),transparent 65%)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* header */
header{padding:22px 18px 8px}
h1{font-size:24px;font-weight:900;letter-spacing:3px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:13px}
#lvl:not(:empty){background:#fff;color:var(--acc);padding:5px 11px;border-radius:99px;font-weight:800;font-size:12px;border:1px solid #dcdffb;box-shadow:0 2px 8px rgba(79,70,229,.12);white-space:nowrap}
#syn{font-size:14px}
#dayc{margin-top:8px;font-weight:700;font-size:14px;color:#3b4270}
.quote{font-style:italic;color:#3b4270;font-size:14px;margin-top:12px;padding:12px 14px;border-radius:14px;background:#fff;border-left:4px solid #6366f1;box-shadow:0 4px 14px rgba(30,40,90,.06)}

/* layout */
main{padding:12px 14px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(30,40,90,.07);overflow:hidden;animation:pop .35s ease both}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--grad)}
.card h3{font-size:16px;font-weight:800;margin-bottom:12px;color:#1d2340}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>.card{margin-bottom:14px}

/* inputs */
input,select{width:100%;background:#f7f9fd;border:1px solid #dfe5f0;color:var(--txt);padding:12px 13px;border-radius:12px;font-size:15px;margin-bottom:9px;color-scheme:light;outline:none;transition:.2s}
input:focus,select:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15);background:#fff}
input::placeholder{color:#9aa3bd}
select option{background:#fff;color:var(--txt)}

/* buttons */
button,.btnlike{background:var(--grad);color:#fff;border:0;padding:12px 16px;border-radius:12px;font-weight:700;font-size:15px;display:block;text-align:center;box-shadow:var(--glow);transition:transform .15s,box-shadow .2s;cursor:pointer}
button:active,.btnlike:active{transform:scale(.96)}
button.g,.btnlike{background:#eef1fa;color:#3b4270;box-shadow:none}
button.r{background:linear-gradient(135deg,#fb7185,#e11d48);color:#fff;box-shadow:0 6px 18px rgba(225,29,72,.22)}
.x{background:none!important;color:var(--mut)!important;padding:4px 8px;box-shadow:none!important;font-size:16px}
.big{font-size:58px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;margin:16px 0;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* bottom nav */
nav{position:fixed;bottom:12px;left:12px;right:12px;display:flex;gap:4px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:0 10px 30px rgba(30,40,90,.14);z-index:5}
nav button{flex:1;background:none;color:var(--mut);border-radius:16px;padding:8px 0;font-size:11px;font-weight:700;box-shadow:none}
nav button.on{background:var(--grad);color:#fff;box-shadow:var(--glow)}
nav b{display:block;font-size:20px;margin-bottom:1px}

/* tabs */
.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px;padding:2px 2px 6px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;padding:9px 14px;font-size:13px;border-radius:99px}

/* bars */
.bar{height:10px;background:#e9edf6;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .5s ease}
.bar[style*="flex"] i{border-radius:0}

/* habits */
.habit{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:#f7f9fd;border:1px solid var(--line);margin-bottom:8px;transition:.2s;cursor:pointer}
.habit:active{transform:scale(.98)}
.habit.done{background:#ecfdf5;border-color:#a7f3d0;color:var(--mut);text-decoration:line-through}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid #a5b4fc;background:#fff;display:grid;place-items:center;font-weight:900;flex-shrink:0;transition:.2s}
.done .chk{background:#10b981;border-color:#10b981;color:#fff;box-shadow:0 3px 10px rgba(16,185,129,.35)}

/* lists & text */
.li{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px}.li:last-child{border:0}
.stat{font-size:25px;font-weight:900}
.mut{color:var(--mut);font-size:12px;letter-spacing:.2px}.pos{color:var(--ok)}.neg{color:var(--bad)}

#toast{position:fixed;bottom:105px;left:50%;transform:translateX(-50%);background:#1d2340;color:#fff;padding:11px 20px;border-radius:99px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.2);white-space:nowrap}

/* charts */
.chart{position:relative;height:160px;display:flex;align-items:flex-end;gap:6px;margin:24px 0 0}
.chart .col{flex:1;height:100%;display:flex;justify-content:center;align-items:flex-end;cursor:pointer}
.stack{width:70%;max-width:32px;min-height:3px;display:flex;flex-direction:column-reverse;border-radius:8px 8px 3px 3px;overflow:hidden;background:#e9edf6;transition:height .5s ease}
.stack i{display:block;width:100%}
.col.sel .stack{outline:2px solid #4f46e5;outline-offset:2px}
.goal{position:absolute;left:0;right:0;border-top:1px dashed var(--warn);pointer-events:none}
.goal span{position:absolute;right:0;top:-16px;font-size:10px;color:#d97706;font-weight:700}
.labels{display:flex;gap:6px}.labels small{flex:1;text-align:center;font-size:11px;color:var(--mut);margin-top:7px;cursor:pointer}
.labels small.on{color:#4f46e5;font-weight:800}
.donut{width:124px;height:124px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;box-shadow:0 6px 20px rgba(30,40,90,.1)}
.donut div{width:86px;height:86px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:900;font-size:15px;color:#1d2340}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.ycell{aspect-ratio:1;border-radius:2px;display:block}
.outbox{margin-top:12px;padding:16px;border-radius:14px;background:#f7f9fd;border:1px dashed #cfd6e6;text-align:center;color:var(--mut);font-size:13px}
</style></head><body>
<header><div class="row between"><h1>❄ WINTER ARC</h1><div class="sub row" style="gap:6px"><span id="lvl"></span><span id="syn"></span></div></div><div id="dayc"></div><div id="quote" class="quote"></div></header>
<main id="app"></main><div id="toast"></div>
<nav><button data-p="arc" onclick="go('arc')"><b>❄</b>Arc</button><button data-p="study" onclick="go('study')"><b id="nst">⏱</b>Study</button><button data-p="money" onclick="go('money')"><b>₹</b>Money</button><button data-p="more" onclick="go('more')"><b>⚙</b>More</button></nav>
<script>
const K='winterArc_v1',SK='winterArc_sync',$=id=>document.getElementById(id),v=id=>$(id).value.trim();
const ds=x=>x.toLocaleDateString('en-CA'),td=()=>ds(new Date()),mo=()=>td().slice(0,7);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>'₹'+Math.round(n).toLocaleString('en-IN'),sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const fm=m=>m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m`;
const short=m=>m>=60?(m/60).toFixed(m%60?1:0)+'h':m+'m';
const DEF={start:td(),days:90,goal:240,budget:0,
 habits:['Wake up before 6:30 AM','Workout / walk 20 min','Hit study goal','Read 10 pages','No junk food','No reels till study is done','Log every expense','Sleep by 11 PM'].map((n,i)=>({id:'h'+i,n})),
 hlog:{},sessions:[],timer:{run:false,t0:0,acc:0,subj:'',topic:'',pomo:false},
 acc:[{id:'b1',name:'Bank 1',type:'bank',open:0},{id:'b2',name:'Bank 2',type:'bank',open:0},{id:'cc',name:'Credit Card',type:'card',open:0,limit:0}],
 tx:[],debts:[],fixed:[],inv:[]};
let S=Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem(K)||'{}'));
let P='arc',MT='over',TT='exp',HM=mo(),wl=null;
const Q=["You don't need motivation. You need to start.","Lazy mood? Do 10 minutes. Then decide.","Small daily wins beat rare heroic efforts.","Winter is for building. Spring is for showing.","Every rupee tracked is a rupee controlled.","Don't break the chain.","The you of 90 days later is watching.","Comfort is the enemy of the arc.","One more session. One less excuse.","Show up even when it's ugly.","Debt-free and disciplined. That's the arc.","Nobody is coming to save you. Open the book."];
const RK=['Snowflake','Frost','Ice Cold','Blizzard','Glacier','Avalanche','Polar Beast','Arctic Legend'];
/* theme colours used inside JS */
const C0='#eef1f7',CSEL='#4f46e5',CFULL='#4ade80',CNONE='#fecdd3';
const part=f=>`rgba(14,165,233,${(.18+.55*f).toFixed(2)})`;
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,1700)}
function go(p){P=p;render();scrollTo(0,0)}

/* ---------- CLOUD SYNC ---------- */
let SY=JSON.parse(localStorage.getItem(SK)||'{}'),pushT=null,syncState='';
function setSync(s){syncState=s;const e=$('syn');if(e)e.textContent=s}
function save(){S._t=Date.now();localStorage.setItem(K,JSON.stringify(S));if(SY.url){clearTimeout(pushT);setSync('⏳');pushT=setTimeout(push,2500)}}
function useCloud(c){S=Object.assign(structuredClone(DEF),c);localStorage.setItem(K,JSON.stringify(S));render()}
async function getCloud(url,pin){const r=await fetch(url+'?pin='+encodeURIComponent(pin));const j=await r.json();if(!j.ok)throw j.err;return j.data||{}}
async function push(){if(!SY.url)return;try{const r=await fetch(SY.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({pin:SY.pin,data:S})});const j=await r.json();if(!j.ok)throw j.err;setSync('☁✓')}catch(e){setSync('☁✗')}}
async function pull(){if(!SY.url)return;setSync('⏳');try{const c=await getCloud(SY.url,SY.pin);
 if((c._t||0)>(S._t||0)){useCloud(c);toast('Synced from cloud ☁')}else if(!c._t||(S._t||0)>c._t)await push();setSync('☁✓')}catch(e){setSync('☁✗')}}
async function connect(){const url=v('surl'),pin=v('spin');if(!url.startsWith('https://script.google.com/'))return alert('Paste the Web app URL from Google Apps Script (ends with /exec)');if(!pin)return alert('Enter your PIN');
 setSync('⏳');try{const c=await getCloud(url,pin);SY={url,pin};localStorage.setItem(SK,JSON.stringify(SY));
  if(c._t&&confirm(`Cloud already has data (last saved ${new Date(c._t).toLocaleString('en-IN')}).\n\nOK = Download cloud data to THIS device (use this on laptop / 2nd device)\nCancel = Replace cloud with THIS device's data`)){useCloud(c);toast('Downloaded from cloud ☁')}
  else{S._t=S._t||Date.now();localStorage.setItem(K,JSON.stringify(S));await push();toast('Uploaded to cloud ☁')}
  setSync('☁✓');render()}catch(e){setSync('');alert('Could not connect: '+e+'\n\nCheck the URL, the PIN, and that "Who has access" is set to Anyone.')}}
function disc(){if(confirm('Stop syncing on this device? (Data stays on this device and in Drive.)')){SY={};localStorage.removeItem(SK);setSync('');render()}}

/* ---------- SHARED CALENDAR GRID ---------- */
function weekOf(off){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);return [...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return ds(x)})}
function periodDays(V,O){
 if(V==='week'){const W=weekOf(O),f=d=>new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'});return{label:O===0?'This week':O===-1?'Last week':f(W[0])+' – '+f(W[6]),days:W}}
 if(V==='month'){const x=new Date();x.setDate(1);x.setMonth(x.getMonth()+O);const y=x.getFullYear(),m=x.getMonth(),n=new Date(y,m+1,0).getDate();
  return{label:x.toLocaleDateString('en-IN',{month:'long',year:'numeric'}),days:[...Array(n)].map((_,i)=>ds(new Date(y,m,i+1))),lead:(new Date(y,m,1).getDay()+6)%7}}
 const y=new Date().getFullYear()+O,days=[];for(let d=new Date(y,0,1);d.getFullYear()===y;d.setDate(d.getDate()+1))days.push(ds(d));return{label:String(y),days,year:y}}
function gridView(V,p,cf,lf,pk,sd){const sel=d=>d===sd?`;outline:2px solid ${CSEL};outline-offset:1px`:'';
 if(V==='week'){const DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  return `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">${p.days.map((d,i)=>`<div onclick="${pk}('${d}')" style="background:${cf(d)};border-radius:8px;padding:8px 2px;text-align:center${sel(d)}"><div style="font-size:11px">${DN[i]}</div><div style="font-weight:800;font-size:16px">${+d.slice(8)}</div><div style="font-size:11px">${lf(d)||'–'}</div></div>`).join('')}</div>`}
 if(V==='month'){
  return `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${['M','T','W','T','F','S','S'].map(x=>`<div class="mut" style="text-align:center">${x}</div>`).join('')}${'<div></div>'.repeat(p.lead)}${p.days.map(d=>{const l=lf(d);return `<div onclick="${pk}('${d}')" style="background:${cf(d)};border-radius:6px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center${sel(d)}"><b style="font-size:13px">${+d.slice(8)}</b>${l?`<span style="font-size:9px">${l}</span>`:''}</div>`}).join('')}</div>`}
 const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];let h='';
 for(let m=0;m<12;m++){const n=new Date(p.year,m+1,0).getDate();h+=`<div style="display:grid;grid-template-columns:26px repeat(31,1fr);gap:2px;margin-bottom:3px;align-items:center"><span class="mut" style="font-size:10px">${MN[m]}</span>${[...Array(31)].map((_,i)=>{if(i>=n)return '<span></span>';const d=ds(new Date(p.year,m,i+1));return `<span class="ycell" onclick="${pk}('${d}')" style="background:${cf(d)}${d===sd?`;outline:1px solid ${CSEL}`:''}"></span>`}).join('')}</div>`}
 return h}
function viewBtns(cur,fn){return `<div class="row" style="gap:6px;margin-bottom:10px">${[['week','Week'],['month','Month'],['year','Year']].map(([k,n])=>`<button class="${cur===k?'':'g'}" style="flex:1;padding:8px;font-size:13px" onclick="${fn}('${k}')">${n}</button>`).join('')}</div>`}
const longDate=d=>new Date(d+'T00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
const shortDate=d=>new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const prevDay=d=>{const y=new Date(d+'T00:00');y.setDate(y.getDate()-1);return ds(y)};
const shiftDay=(d,n)=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()+n);return ds(x)};
const arcEnd=()=>shiftDay(S.start,(S.days||90)-1);
const inArc=d=>d>=S.start&&d<=arcEnd();
const outLabel=d=>d<S.start?`Outside Winter Arc · starts ${shortDate(S.start)}`:`Outside Winter Arc · ended ${shortDate(arcEnd())}`;
const outBox=d=>`<div class="outbox">❄ ${outLabel(d)}<br><span style="font-size:12px">This day isn't part of your Winter Arc, so nothing is counted.</span></div>`;

/* ---------- HABIT CORE ---------- */
const habitsOn=d=>S.habits.filter(h=>!h.from||h.from<=d);
function hStat(d){const L=S.hlog[d]||[],hs=habitsOn(d);return{done:hs.filter(h=>L.includes(h.id)),miss:hs.filter(h=>!L.includes(h.id)),n:hs.length}}
const doneIds=d=>hStat(d).done.map(h=>h.id);
const minsOn=d=>sum(S.sessions.filter(s=>s.date===d),s=>s.mins);
const dayScore=d=>{const s=hStat(d);return((s.n?s.done.length/s.n:0)+Math.min(1,minsOn(d)/(S.goal||1)))/2};
const goodDay=d=>{const s=hStat(d);return(S.goal>0&&minsOn(d)>=S.goal/2)||(s.n>0&&s.done.length>=Math.ceil(s.n*.6))};
function streak(){let n=0,d=new Date();if(!goodDay(td()))d.setDate(d.getDate()-1);while(n<2000&&goodDay(ds(d))){n++;d.setDate(d.getDate()-1)}return n}
const xp=()=>sum(Object.values(S.hlog),a=>a.length)*20+sum(S.sessions,s=>s.mins);

/* ---------- HABIT HEATMAP ---------- */
let HV='week',HO=0,HD=td();
const active=d=>d<=td()&&(inArc(d)||(S.hlog[d]||[]).length>0);
function hColor(d){if(!active(d))return C0;const s=hStat(d);if(!s.n)return C0;const f=s.done.length/s.n;return f===1?CFULL:f===0?CNONE:part(f)}
function hView(x){HV=x;HO=0;render()}
function hNav(n){const o=Math.min(0,HO+n);if(o===HO)return;HO=o;render()}
function hPick(d){HD=d;render()}
function hDay(n){const k=shiftDay(HD,n);if(k>td())return;HD=k;render()}
function togHD(d,id){if(d>td())return;const a=S.hlog[d]||(S.hlog[d]=[]),i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);save();render()}
function hSum(days){const A=days.filter(d=>active(d)&&hStat(d).n);if(!A.length)return '<div class="mut" style="margin-top:12px">No data in this period yet.</div>';
 let tot=0,dn=0,perfect=0;const miss={};A.forEach(d=>{const s=hStat(d);tot+=s.n;dn+=s.done.length;if(s.done.length===s.n)perfect++;s.miss.forEach(h=>miss[h.n]=(miss[h.n]||0)+1)});
 const top=Object.entries(miss).sort((a,b)=>b[1]-a[1]).slice(0,3);
 return `<div class="grid2" style="margin-top:12px"><div><div class="mut">COMPLETION</div><div class="stat">${Math.round(dn/tot*100)}%</div></div><div><div class="mut">PERFECT DAYS</div><div class="stat">${perfect}/${A.length}</div></div></div>
 ${top.length?`<div class="mut" style="margin-top:10px">MOST MISSED</div>${top.map(([n,c])=>`<div class="li"><span>${esc(n)}</span><span class="neg">missed ${c} day${c>1?'s':''}</span></div>`).join('')}`:'<div class="pos" style="margin-top:10px">Nothing missed. Beast mode 🏆</div>'}`}
function hDetail(){const d=HD,s=hStat(d),fut=d>td(),out=!fut&&!active(d),past=!fut&&!out,yd=prevDay(d),ys=hStat(yd);
 const slipped=s.miss.filter(h=>ys.done.some(x=>x.id===h.id)),fixed=s.done.filter(h=>ys.miss.some(x=>x.id===h.id));
 const status=fut?'Future day':out?'Outside Winter Arc':`${s.done.length}/${s.n} habits done · ${fm(minsOn(d))} studied`;
 return `<div style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px">
 <div class="row between"><button class="x" onclick="hDay(-1)">◀</button><div style="text-align:center"><b>${longDate(d)}</b><div class="mut">${status}</div></div><button class="x" onclick="hDay(1)" style="${d>=td()?'opacity:.25':''}">▶</button></div>
 ${out?outBox(d):''}
 ${past?s.done.map(h=>`<div class="habit done" onclick="togHD('${d}','${h.id}')" style="margin-top:6px"><div class="chk">✓</div><div style="flex:1">${esc(h.n)}</div></div>`).join('')+
 s.miss.map(h=>`<div class="habit" onclick="togHD('${d}','${h.id}')" style="margin-top:6px;border:1px solid ${CNONE};background:#fff5f6"><div class="chk" style="border-color:var(--bad);color:var(--bad)">✗</div><div style="flex:1">${esc(h.n)} <span class="neg" style="font-size:12px">missed</span></div></div>`).join(''):''}

const CCOL={Food:'#f97316',Groceries:'#22c55e',Transport:'#0ea5e9',Fuel:'#eab308',Shopping:'#ec4899',Bills:'#8b5cf6',Rent:'#ef4444',Recharge:'#14b8a6',Education:'#3b82f6',Health:'#10b981',Entertainment:'#d946ef',Gifts:'#fb7185',Other:'#94a3b8'};
const ccol=c=>CCOL[c]||'#94a3b8';
const kR=n=>{n=Math.round(n);return '₹'+(n>=100000?(n/100000).toFixed(1).replace('.0','')+'L':n>=1000?(n/1000).toFixed(1).replace('.0','')+'k':n)};
let SPM={},FIRST=td(),FREF=1,FV='month',FO=0,FD=td(),FW=0,FG=td();
function buildSPM(){SPM={};FIRST=td();
 S.tx.forEach(t=>{if(t.date<FIRST)FIRST=t.date;if(t.type!=='exp'||NOSPEND.includes(t.cat))return;const o=SPM[t.date]||(SPM[t.date]={});o[t.cat]=(o[t.cat]||0)+t.amt});
 const v=Object.values(SPM).map(o=>sum(Object.values(o),x=>x));FREF=v.length?sum(v,x=>x)/v.length:1}
const spentOn=d=>sum(Object.values(SPM[d]||{}),x=>x);

const incOn=d=>sum(S.tx.filter(t=>t.type==='inc'&&t.cat!=='Borrowed'&&t.date===d),t=>t.amt);
const dayLim=d=>S.budget>0?S.budget/new Date(+d.slice(0,4),+d.slice(5,7),0).getDate():0;
const cmp=(x,lbl)=>x>0?`<span class="neg">▲ ${R(x)} more</span> ${lbl}`:x<0?`<span class="pos">▼ ${R(-x)} less</span> ${lbl}`:`Same ${lbl}`;

const FNO='#bbf7d0',FOVER='#fdba74',FWAY='#f87171';
function fColor(d){if(d>td()||d<FIRST)return C0;const s=spentOn(d);if(!s)return FNO;
 const f=s/(dayLim(d)||FREF);return f>1.5?FWAY:f>1?FOVER:part(f)}

function fSum(days,V,O){const PD=days.filter(d=>d<=td()&&d>=FIRST);
 if(!PD.length||!S.tx.length)return '<div class="mut" style="margin-top:12px">No data in this period yet.</div>';
 const T=sum(PD,spentOn),I=sum(PD,incOn),ns=PD.filter(d=>!spentOn(d)).length,big=PD.reduce((b,d)=>spentOn(d)>spentOn(b)?d:b,PD[0]),

  PV=periodDays(V,O-1).days.slice(0,O===0?n:undefined),PT=sum(PV,spentOn),dif=T-PT;
 const cat={},pc={};PD.forEach(d=>catsOn(d).forEach(([c,a])=>cat[c]=(cat[c]||0)+a));PV.forEach(d=>catsOn(d).forEach(([c,a])=>pc[c]=(pc[c]||0)+a));

 return `<div class="grid2" style="margin-top:12px"><div><div class="mut">TOTAL SPENT</div><div class="stat">${R(T)}</div></div><div><div class="mut">AVG / DAY</div><div class="stat">${R(T/PD.length)}</div></div>

 ${spentOn(big)?`<div class="li" onclick="fPick('${big}')" style="cursor:pointer"><span>🔺 Biggest day: ${shortDate(big)}</span><b>${R(spentOn(big))}</b></div>`:''}

function fDetail(){const d=FD,fut=d>td(),pre=!fut&&d<FIRST,s=spentOn(d),lim=dayLim(d),sel=catsOn(d),L=S.tx.filter(t=>t.date===d),diff=s-spentOn(prevDay(d));

function fmap(){const p=periodDays(FV,FO);return `<div class="card"><h3>💸 Spending heatmap</h3>${viewBtns(FV,'fView')}

 let a=0;const grad=st?sel.map(([c,m])=>{const g=`${ccol(c)} ${a/st*360}deg ${(a+m)/st*360}deg`;a+=m;return g}).join(','):`${C0} 0deg 360deg`;
 return `<div class="card"><h3>📊 Spending this week</h3>
 <div class="row between"><button class="x" onclick="fWk(-1)">◀</button><div style="text-align:center"><b>${FW===0?'This week':FW===-1?'Last week':shortDate(W[0])+' – '+shortDate(W[6])}</b><div class="mut">Total ${R(wt)} · Avg ${R(wt/past)}/day</div></div><button class="x" onclick="fWk(1)" style="${FW>=0?'opacity:.25':''}">▶</button></div>
 <div class="mut" style="text-align:center;margin-top:4px;font-size:12px">${cmp(wt-pw,'than the week before')}</div>
 <div class="chart">${lim?`<div class="goal" style="bottom:${lim/max*100}%"><span>Limit ${kR(lim)}/day</span></div>`:''}
 ${W.map((d,i)=>`<div class="col ${d===FG?'sel':''}" onclick="fGPick('${d}')"><div class="stack" style="height:${tot[i]/max*100}%">${catsOn(d).map(([c,m])=>`<i style="height:${m/tot[i]*100}%;background:${ccol(c)}"></i>`).join('')}</div></div>`).join('')}</div>
 <div class="labels">${W.map((d,i)=>`<small class="${d===FG?'on':''}" onclick="fGPick('${d}')">${DN[i]}</small>`).join('')}</div>
 <div style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px"><b>${longDate(FG)}</b>
 <div class="row" style="gap:16px;margin-top:12px"><div class="donut" style="background:conic-gradient(${grad})"><div>${kR(st)}</div></div>
 <div style="flex:1">${sel.length?sel.map(([c,m])=>`<div class="row between" style="font-size:14px;margin-bottom:7px"><span><span class="dot" style="background:${ccol(c)}"></span>${esc(c)}</span><span>${R(m)} <span class="mut">${Math.round(m/st*100)}%</span></span></div>`).join(''):`<div class="mut">${FG>td()?'Future day':'No spending this day 🧊'}</div>`}</div></div>
 <div class="mut" style="margin-top:10px">${cmp(diff,'than the day before')}</div></div></div>`}

/* 6-month income vs spending */
function fMonths(){const M=[...Array(6)].map((_,i)=>{const x=new Date();x.setDate(1);x.setMonth(x.getMonth()-5+i);const k=ds(x).slice(0,7);
  return{k,off:i-5,n:x.toLocaleDateString('en-IN',{month:'short'}),out:sum(Object.keys(SPM).filter(d=>d.startsWith(k)),spentOn),inc:sum(S.tx.filter(t=>t.type==='inc'&&t.cat!=='Borrowed'&&t.date.startsWith(k)),t=>t.amt)}});
 const max=Math.max(1,S.budget||0,...M.map(m=>Math.max(m.out,m.inc)));
 return `<div class="card"><h3>📈 Income vs spending (6 months)</h3>
 <div class="chart">${S.budget>0?`<div class="goal" style="bottom:${S.budget/max*100}%"><span>Budget ${kR(S.budget)}</span></div>`:''}
 ${M.map(m=>`<div class="col" style="gap:3px" onclick="fMon(${m.off})"><div class="stack" style="width:40%;height:${m.inc/max*100}%;background:var(--ok)"></div><div class="stack" style="width:40%;height:${m.out/max*100}%;background:${S.budget>0&&m.out>S.budget?'var(--bad)':'var(--ice)'}"></div></div>`).join('')}</div>
 <div class="labels">${M.map(m=>`<small class="${m.off===0?'on':''}" onclick="fMon(${m.off})">${m.n}</small>`).join('')}</div>
 <div class="row" style="gap:10px;margin-top:8px;font-size:11px;color:var(--mut)"><span><span class="dot" style="background:var(--ok)"></span>Income</span><span><span class="dot" style="background:var(--ice)"></span>Spent</span>${S.budget>0?'<span><span class="dot" style="background:var(--bad)"></span>Over budget</span>':''}</div>
 <div style="margin-top:8px">${M.slice().reverse().map(m=>{const sv=m.inc-m.out;return `<div class="li" onclick="fMon(${m.off})" style="cursor:pointer"><div>${m.n}${m.off===0?' <span class="mut">(so far)</span>':''}<div class="mut">Spent ${R(m.out)} · Income ${R(m.inc)}</div></div><b class="${sv<0?'neg':'pos'}">${sv>=0?'+':''}${R(sv)}${m.inc?` <span class="mut">${Math.round(sv/m.inc*100)}%</span>`:''}</b></div>`}).join('')}</div></div>`}

function mAna(){buildSPM();return fMonths()+fmap()+fUsage()}

/* ---------- MORE ---------- */
function pMore(){return `<div class="card"><h3>☁ Cloud sync (phone ↔ laptop)</h3>${SY.url?`<div class="row between"><span>Connected to Google Drive</span><span class="mut">${syncState}</span></div><div class="mut" style="margin-top:6px">Changes upload automatically. Data is pulled every time you open the app.</div><div class="row" style="margin-top:10px"><button style="flex:1" onclick="pull()">🔄 Sync now</button><button class="g" style="flex:1" onclick="disc()">Disconnect</button></div>`
 :`<div class="mut" style="margin-bottom:10px">Paste your Google Apps Script Web app URL and your PIN.</div><input id="surl" placeholder="https://script.google.com/macros/s/.../exec"><input id="spin" type="password" placeholder="PIN"><button style="width:100%" onclick="connect()">Connect</button>`}</div>
 <div class="card"><h3>Winter Arc settings</h3><div class="mut">Start date</div><input id="sd" type="date" value="${S.start}"><div class="mut">Arc length (days)</div><input id="sdy" type="number" value="${S.days}"><div class="mut" style="margin-bottom:8px">Arc runs ${shortDate(S.start)} → ${shortDate(arcEnd())}</div><div class="mut">Daily study goal (minutes)</div><input id="sg" type="number" value="${S.goal}"><button style="width:100%" onclick="saveSet()">Save</button></div>
 <div class="card"><h3>Backup file</h3><div class="mut" style="margin-bottom:10px">Extra safety: download a backup now and then and keep it in Google Drive.</div>
 <div class="row"><button style="flex:1" onclick="exportD()">⬇ Export</button><label style="flex:1"><span class="btnlike">⬆ Import</span><input type="file" accept=".json" hidden onchange="importD(this.files[0])"></label></div></div>
 <div class="card"><h3>Danger zone</h3><button class="r" style="width:100%" onclick="if(confirm('Delete ALL data on this device?')&&confirm('Really? If sync is on, cloud data will download again on reopen.')){localStorage.removeItem(K);location.reload()}">Reset this device</button></div>`}
function saveSet(){S.start=$('sd').value||td();S.days=+v('sdy')||90;S.goal=+v('sg')||240;save();toast('Saved');render()}
function exportD(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download=`winter-arc-backup-${td()}.json`;a.click()}
function importD(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(structuredClone(DEF),JSON.parse(r.result));save();render();alert('Restored!')}catch(e){alert('Invalid backup file')}};r.readAsText(f)}

/* ---------- CORE ---------- */
function render(){head();$('app').innerHTML={arc:pArc,study:pStudy,money:pMoney,more:pMore}[P]();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===P));$('nst').textContent=S.timer.run?'🔴':'⏱';setSync(syncState)}
setInterval(()=>{const ms=el();if(S.timer.pomo&&S.timer.run&&ms>=25*60000){stopT(true);beep();setTimeout(()=>alert('🍅 Pomodoro done! Take a 5 minute break.'),100);return}
 const t=$('tm');if(t)t.textContent=hms(S.timer.pomo?Math.max(0,25*60000-ms):ms)},500);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(S.timer.run)lock();render();pull()}});
render();pull();
</script></body></html>
