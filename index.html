<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0b1220"><title>Winter Arc</title>
<style>
:root{--bg:#0b1220;--card:#131c2e;--line:#22304a;--txt:#e6edf7;--mut:#8a9bb5;--ice:#7dd3fc;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Roboto,sans-serif}
body{background:var(--bg);color:var(--txt);padding-bottom:80px;-webkit-tap-highlight-color:transparent}
header{padding:18px 16px 10px;background:linear-gradient(180deg,#12213d,var(--bg))}
h1{font-size:21px;letter-spacing:3px;color:var(--ice)}
.sub{color:var(--mut);font-size:13px}
main{padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select{width:100%;background:#0e1626;border:1px solid var(--line);color:var(--txt);padding:11px;border-radius:10px;font-size:15px;margin-bottom:8px}
button,.btnlike{background:var(--ice);color:#0b1220;border:0;padding:11px 14px;border-radius:10px;font-weight:700;font-size:15px;display:block;text-align:center}
button.g,.btnlike{background:#1e2a42;color:var(--txt)}button.r{background:var(--bad);color:#fff}
.big{font-size:54px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:14px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0e1626;border-top:1px solid var(--line)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:10px 0;font-size:12px}
nav button.on{color:var(--ice)}nav b{display:block;font-size:20px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.tabs button{white-space:nowrap;padding:8px 12px;font-size:13px}
.bar{height:10px;background:#0e1626;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ice);transition:.3s}
.habit{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;background:#0e1626;margin-bottom:6px}
.habit.done{background:#12301f;color:var(--mut);text-decoration:line-through}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--ice);display:grid;place-items:center;font-weight:900;flex-shrink:0}
.done .chk{background:var(--ok);border-color:var(--ok);color:#0b1220}
.li{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px}.li:last-child{border:0}
.mut{color:var(--mut);font-size:12px}.pos{color:var(--ok)}.neg{color:var(--bad)}
.x{background:none!important;color:var(--mut)!important;padding:4px 8px}
.stat{font-size:22px;font-weight:800}.quote{font-style:italic;color:#cbd5e1;font-size:14px;margin-top:8px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ok);color:#0b1220;padding:10px 18px;border-radius:20px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.chart{position:relative;height:150px;display:flex;align-items:flex-end;gap:6px;margin:22px 0 0}
.chart .col{flex:1;height:100%;display:flex;justify-content:center;align-items:flex-end}
.stack{width:70%;max-width:32px;min-height:3px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 0 0;overflow:hidden;background:#1a2438;transition:.3s}
.stack i{display:block;width:100%}
.col.sel .stack{outline:2px solid #fff;outline-offset:1px}
.goal{position:absolute;left:0;right:0;border-top:1px dashed var(--warn);pointer-events:none}
.goal span{position:absolute;right:0;top:-15px;font-size:10px;color:var(--warn)}
.labels{display:flex;gap:6px}.labels small{flex:1;text-align:center;font-size:11px;color:var(--mut);margin-top:6px}
.labels small.on{color:var(--txt);font-weight:700}
.donut{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.donut div{width:84px;height:84px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:15px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px}
.ycell{aspect-ratio:1;border-radius:2px;display:block}
</style></head><body>
<header><div class="row between"><h1>❄ WINTER ARC</h1><div class="sub"><span id="lvl"></span> <span id="syn"></span></div></div><div id="dayc" class="sub"></div><div id="quote" class="quote"></div></header>
<main id="app"></main><div id="toast"></div>
<nav><button data-p="arc" onclick="go('arc')"><b>❄</b>Arc</button><button data-p="study" onclick="go('study')"><b id="nst">⏱</b>Study</button><button data-p="money" onclick="go('money')"><b>₹</b>Money</button><button data-p="more" onclick="go('more')"><b>⚙</b>More</button></nav>
<script>
const K='winterArc_v1',SK='winterArc_sync',$=id=>document.getElementById(id),v=id=>$(id).value.trim();
const ds=x=>x.toLocaleDateString('en-CA'),td=()=>ds(new Date()),mo=()=>td().slice(0,7);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>'₹'+Math.round(n).toLocaleString('en-IN'),sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const fm=m=>m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m`;
const short=m=>m>=60?(m/60).toFixed(m%60?1:0)+'h':m+'m';
const DEF={start:td(),days:90,goal:240,budget:0,
 habits:['Wake up before 6:30 AM','Workout / walk 20 min','Hit study goal','Read 10 pages','No junk food','No reels till study is done','Log every expense','Sleep by 11 PM'].map((n,i)=>({id:'h'+i,n})),
 hlog:{},sessions:[],timer:{run:false,t0:0,acc:0,subj:'',topic:'',pomo:false},
 acc:[{id:'b1',name:'Bank 1',type:'bank',open:0},{id:'b2',name:'Bank 2',type:'bank',open:0},{id:'cc',name:'Credit Card',type:'card',open:0,limit:0}],
 tx:[],debts:[],fixed:[],inv:[]};
let S=Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem(K)||'{}'));
let P='arc',MT='over',TT='exp',HM=mo(),wl=null;
const Q=["You don't need motivation. You need to start.","Lazy mood? Do 10 minutes. Then decide.","Small daily wins beat rare heroic efforts.","Winter is for building. Spring is for showing.","Every rupee tracked is a rupee controlled.","Don't break the chain.","The you of 90 days later is watching.","Comfort is the enemy of the arc.","One more session. One less excuse.","Show up even when it's ugly.","Debt-free and disciplined. That's the arc.","Nobody is coming to save you. Open the book."];
const RK=['Snowflake','Frost','Ice Cold','Blizzard','Glacier','Avalanche','Polar Beast','Arctic Legend'];
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,1700)}
function go(p){P=p;render();scrollTo(0,0)}

/* ---------- CLOUD SYNC ---------- */
let SY=JSON.parse(localStorage.getItem(SK)||'{}'),pushT=null,syncState='';
function setSync(s){syncState=s;const e=$('syn');if(e)e.textContent=s}
function save(){S._t=Date.now();localStorage.setItem(K,JSON.stringify(S));if(SY.url){clearTimeout(pushT);setSync('⏳');pushT=setTimeout(push,2500)}}
function useCloud(c){S=Object.assign(structuredClone(DEF),c);localStorage.setItem(K,JSON.stringify(S));render()}
async function getCloud(url,pin){const r=await fetch(url+'?pin='+encodeURIComponent(pin));const j=await r.json();if(!j.ok)throw j.err;return j.data||{}}
async function push(){if(!SY.url)return;try{const r=await fetch(SY.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({pin:SY.pin,data:S})});const j=await r.json();if(!j.ok)throw j.err;setSync('☁✓')}catch(e){setSync('☁✗')}}
async function pull(){if(!SY.url)return;setSync('⏳');try{const c=await getCloud(SY.url,SY.pin);
 if((c._t||0)>(S._t||0)){useCloud(c);toast('Synced from cloud ☁')}else if(!c._t||(S._t||0)>c._t)await push();setSync('☁✓')}catch(e){setSync('☁✗')}}
async function connect(){const url=v('surl'),pin=v('spin');if(!url.startsWith('https://script.google.com/'))return alert('Paste the Web app URL from Google Apps Script (ends with /exec)');if(!pin)return alert('Enter your PIN');
 setSync('⏳');try{const c=await getCloud(url,pin);SY={url,pin};localStorage.setItem(SK,JSON.stringify(SY));
  if(c._t&&confirm(`Cloud already has data (last saved ${new Date(c._t).toLocaleString('en-IN')}).\n\nOK = Download cloud data to THIS device (use this on laptop / 2nd device)\nCancel = Replace cloud with THIS device's data`)){useCloud(c);toast('Downloaded from cloud ☁')}
  else{S._t=S._t||Date.now();localStorage.setItem(K,JSON.stringify(S));await push();toast('Uploaded to cloud ☁')}
  setSync('☁✓');render()}catch(e){setSync('');alert('Could not connect: '+e+'\n\nCheck the URL, the PIN, and that "Who has access" is set to Anyone.')}}
function disc(){if(confirm('Stop syncing on this device? (Data stays on this device and in Drive.)')){SY={};localStorage.removeItem(SK);setSync('');render()}}

/* ---------- SHARED CALENDAR GRID ---------- */
function weekOf(off){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);return [...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return ds(x)})}
function periodDays(V,O){
 if(V==='week'){const W=weekOf(O),f=d=>new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'});return{label:O===0?'This week':O===-1?'Last week':f(W[0])+' – '+f(W[6]),days:W}}
 if(V==='month'){const x=new Date();x.setDate(1);x.setMonth(x.getMonth()+O);const y=x.getFullYear(),m=x.getMonth(),n=new Date(y,m+1,0).getDate();
  return{label:x.toLocaleDateString('en-IN',{month:'long',year:'numeric'}),days:[...Array(n)].map((_,i)=>ds(new Date(y,m,i+1))),lead:(new Date(y,m,1).getDay()+6)%7}}
 const y=new Date().getFullYear()+O,days=[];for(let d=new Date(y,0,1);d.getFullYear()===y;d.setDate(d.getDate()+1))days.push(ds(d));return{label:String(y),days,year:y}}
function gridView(V,p,cf,lf,pk,sd){const sel=d=>d===sd?';outline:2px solid #fff;outline-offset:1px':'';
 if(V==='week'){const DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  return `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">${p.days.map((d,i)=>`<div onclick="${pk}('${d}')" style="background:${cf(d)};border-radius:8px;padding:8px 2px;text-align:center${sel(d)}"><div style="font-size:11px">${DN[i]}</div><div style="font-weight:800;font-size:16px">${+d.slice(8)}</div><div style="font-size:11px">${lf(d)||'–'}</div></div>`).join('')}</div>`}
 if(V==='month'){
  return `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${['M','T','W','T','F','S','S'].map(x=>`<div class="mut" style="text-align:center">${x}</div>`).join('')}${'<div></div>'.repeat(p.lead)}${p.days.map(d=>{const l=lf(d);return `<div onclick="${pk}('${d}')" style="background:${cf(d)};border-radius:6px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center${sel(d)}"><b style="font-size:13px">${+d.slice(8)}</b>${l?`<span style="font-size:9px">${l}</span>`:''}</div>`}).join('')}</div>`}
 const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];let h='';
 for(let m=0;m<12;m++){const n=new Date(p.year,m+1,0).getDate();h+=`<div style="display:grid;grid-template-columns:26px repeat(31,1fr);gap:2px;margin-bottom:3px;align-items:center"><span class="mut" style="font-size:10px">${MN[m]}</span>${[...Array(31)].map((_,i)=>{if(i>=n)return '<span></span>';const d=ds(new Date(p.year,m,i+1));return `<span class="ycell" onclick="${pk}('${d}')" style="background:${cf(d)}${d===sd?';outline:1px solid #fff':''}"></span>`}).join('')}</div>`}
 return h}
function viewBtns(cur,fn){return `<div class="row" style="gap:6px;margin-bottom:10px">${[['week','Week'],['month','Month'],['year','Year']].map(([k,n])=>`<button class="${cur===k?'':'g'}" style="flex:1;padding:8px;font-size:13px" onclick="${fn}('${k}')">${n}</button>`).join('')}</div>`}
const longDate=d=>new Date(d+'T00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
const prevDay=d=>{const y=new Date(d+'T00:00');y.setDate(y.getDate()-1);return ds(y)};
const shiftDay=(d,n)=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()+n);return ds(x)};

/* ---------- HABIT CORE ---------- */
const habitsOn=d=>S.habits.filter(h=>!h.from||h.from<=d);
function hStat(d){const L=S.hlog[d]||[],hs=habitsOn(d);return{done:hs.filter(h=>L.includes(h.id)),miss:hs.filter(h=>!L.includes(h.id)),n:hs.length}}
const doneIds=d=>hStat(d).done.map(h=>h.id);
const minsOn=d=>sum(S.sessions.filter(s=>s.date===d),s=>s.mins);
const dayScore=d=>{const s=hStat(d);return((s.n?s.done.length/s.n:0)+Math.min(1,minsOn(d)/(S.goal||1)))/2};
const goodDay=d=>{const s=hStat(d);return(S.goal>0&&minsOn(d)>=S.goal/2)||(s.n>0&&s.done.length>=Math.ceil(s.n*.6))};
function streak(){let n=0,d=new Date();if(!goodDay(td()))d.setDate(d.getDate()-1);while(n<2000&&goodDay(ds(d))){n++;d.setDate(d.getDate()-1)}return n}
const xp=()=>sum(Object.values(S.hlog),a=>a.length)*20+sum(S.sessions,s=>s.mins);

/* ---------- HABIT HEATMAP ---------- */
let HV='week',HO=0,HD=td();
const active=d=>d<=td()&&(d>=S.start||(S.hlog[d]||[]).length>0);
function hColor(d){if(!active(d))return '#1a2438';const s=hStat(d);if(!s.n)return '#1a2438';const f=s.done.length/s.n;return f===1?'#22c55e':f===0?'#4c1d24':`rgba(125,211,252,${.25+.6*f})`}
function hView(x){HV=x;HO=0;render()}
function hNav(n){const o=Math.min(0,HO+n);if(o===HO)return;HO=o;render()}
function hPick(d){HD=d;render()}
function hDay(n){const k=shiftDay(HD,n);if(k>td())return;HD=k;render()}
function togHD(d,id){if(d>td())return;const a=S.hlog[d]||(S.hlog[d]=[]),i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);save();render()}
function hSum(days){const A=days.filter(d=>active(d)&&hStat(d).n);if(!A.length)return '<div class="mut" style="margin-top:12px">No data in this period yet.</div>';
 let tot=0,dn=0,perfect=0;const miss={};A.forEach(d=>{const s=hStat(d);tot+=s.n;dn+=s.done.length;if(s.done.length===s.n)perfect++;s.miss.forEach(h=>miss[h.n]=(miss[h.n]||0)+1)});
 const top=Object.entries(miss).sort((a,b)=>b[1]-a[1]).slice(0,3);
 return `<div class="grid2" style="margin-top:12px"><div><div class="mut">COMPLETION</div><div class="stat">${Math.round(dn/tot*100)}%</div></div><div><div class="mut">PERFECT DAYS</div><div class="stat">${perfect}/${A.length}</div></div></div>
 ${top.length?`<div class="mut" style="margin-top:10px">MOST MISSED</div>${top.map(([n,c])=>`<div class="li"><span>${esc(n)}</span><span class="neg">missed ${c} day${c>1?'s':''}</span></div>`).join('')}`:'<div class="pos" style="margin-top:10px">Nothing missed. Beast mode 🏆</div>'}`}
function hDetail(){const d=HD,s=hStat(d),past=d<=td(),yd=prevDay(d),ys=hStat(yd);
 const slipped=s.miss.filter(h=>ys.done.some(x=>x.id===h.id)),fixed=s.done.filter(h=>ys.miss.some(x=>x.id===h.id));
 return `<div style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px">
 <div class="row between"><button class="x" onclick="hDay(-1)">◀</button><div style="text-align:center"><b>${longDate(d)}</b><div class="mut">${past?`${s.done.length}/${s.n} habits done · ${fm(minsOn(d))} studied`:'Future day'}</div></div><button class="x" onclick="hDay(1)" style="${d>=td()?'opacity:.25':''}">▶</button></div>
 ${past?s.done.map(h=>`<div class="habit done" onclick="togHD('${d}','${h.id}')" style="margin-top:6px"><div class="chk">✓</div><div style="flex:1">${esc(h.n)}</div></div>`).join('')+
 s.miss.map(h=>`<div class="habit" onclick="togHD('${d}','${h.id}')" style="margin-top:6px;border:1px solid #4c1d24"><div class="chk" style="border-color:var(--bad);color:var(--bad)">✗</div><div style="flex:1">${esc(h.n)} <span class="neg" style="font-size:12px">missed</span></div></div>`).join(''):''}
 ${past&&active(yd)&&(slipped.length||fixed.length)?`<div style="margin-top:8px;font-size:13px">vs previous day:${fixed.length?`<div class="pos">✓ Improved: ${fixed.map(h=>esc(h.n)).join(', ')}</div>`:''}${slipped.length?`<div class="neg">✗ Slipped: ${slipped.map(h=>esc(h.n)).join(', ')}</div>`:''}</div>`:''}
 ${past?'<div class="mut" style="margin-top:8px">Forgot to tick something? Tap a habit above to fix it.</div>':''}</div>`}
function hmap(){const p=periodDays(HV,HO);return `<div class="card"><h3>📅 Habit tracker</h3>${viewBtns(HV,'hView')}
 <div class="row between" style="margin-bottom:10px"><button class="x" onclick="hNav(-1)">◀</button><b>${p.label}</b><button class="x" onclick="hNav(1)" style="${HO>=0?'opacity:.25':''}">▶</button></div>
 ${gridView(HV,p,hColor,d=>{if(!active(d))return '';const s=hStat(d);return s.done.length+'/'+s.n},'hPick',HD)}
 <div class="row" style="gap:10px;margin-top:10px;font-size:11px;color:var(--mut);flex-wrap:wrap"><span><span class="dot" style="background:#22c55e"></span>All done</span><span><span class="dot" style="background:rgba(125,211,252,.6)"></span>Partial</span><span><span class="dot" style="background:#4c1d24"></span>None</span><span><span class="dot" style="background:#1a2438"></span>Not tracked</span></div>
 ${hSum(p.days)}${hDetail()}</div>`}

/* ---------- ARC PAGE ---------- */
function head(){const day=Math.floor((new Date(td())-new Date(S.start))/864e5)+1;
 $('dayc').textContent=day<1?`Arc starts on ${S.start}`:day>S.days?`Arc complete! ${S.days} days done 🏆`:`Day ${day} of ${S.days} · ${S.days-day} days left`;
 const l=Math.floor(xp()/500)+1;$('lvl').textContent=`Lv ${l} · ${RK[Math.min(Math.floor((l-1)/3),7)]}`;
 $('quote').textContent='“'+Q[Math.max(day,0)%Q.length]+'”'}
function msg(s){return s>=100?'Perfect day. This is who you are now ❄':s>=70?'Strong day. Finish it off.':s>=40?"Halfway there. Don't stop now.":s>0?'Started. Keep stacking small wins.':'Cold start. Pick ONE habit and do it right now.'}
function pArc(){const d=td(),done=doneIds(d),hs=habitsOn(d),sc=Math.round(dayScore(d)*100),x=xp(),l=Math.floor(x/500)+1;
 return `<div class="card"><div class="row between"><div><div class="mut">TODAY'S SCORE</div><div class="stat">${sc}%</div></div><div style="text-align:right"><div class="mut">STREAK</div><div class="stat">🔥 ${streak()}</div></div></div>
 <div class="bar" style="margin-top:10px"><i style="width:${sc}%"></i></div><div class="mut" style="margin-top:8px">${msg(sc)}</div>
 <div class="mut" style="margin-top:4px">XP ${x} · ${500-x%500} XP to Level ${l+1}</div></div>
 ${S.tx.some(t=>t.date===d)?'':`<div class="card" style="border-color:var(--warn)"><div class="row between"><span>💸 No expense logged today</span><button style="padding:8px 12px;font-size:13px" onclick="MT='add';go('money')">Log now</button></div></div>`}
 <div class="card"><h3>Feeling lazy?</h3><div class="mut" style="margin-bottom:10px">Don't think. Just start a 10-minute session. Starting is the hardest part.</div><button style="width:100%" onclick="lazyStart()">▶ Just 10 minutes</button></div>
 <div class="card"><h3>Today's non-negotiables (${done.length}/${hs.length})</h3>
 ${hs.map(h=>`<div class="habit ${done.includes(h.id)?'done':''}" onclick="togH('${h.id}')"><div class="chk">${done.includes(h.id)?'✓':''}</div><div style="flex:1">${esc(h.n)}</div><button class="x" onclick="event.stopPropagation();delH('${h.id}')">✕</button></div>`).join('')}
 <div class="row" style="margin-top:8px"><input id="nh" placeholder="Add a habit" style="margin:0"><button onclick="addH()">+</button></div></div>
 ${hmap()}`}
function togH(id){const d=td(),a=S.hlog[d]||(S.hlog[d]=[]),i=a.indexOf(id);if(i<0){a.push(id);navigator.vibrate?.(30);const s=hStat(d);if(s.done.length===s.n)toast('All done today! Legend 🏆');else toast('+20 XP')}else a.splice(i,1);save();render()}
function delH(id){if(confirm('Remove this habit? (It will disappear from past days too.)')){S.habits=S.habits.filter(h=>h.id!==id);save();render()}}
function addH(){const n=v('nh');if(!n)return;S.habits.push({id:uid(),n,from:td()});save();render()}
function lazyStart(){if(!S.timer.run){S.timer.pomo=false;S.timer.subj=S.timer.subj||'Quick start'}P='study';startT();scrollTo(0,0)}

/* ---------- STUDY TIMER ---------- */

function pick(d){GD=d;render()}
function usage(){const W=weekOf(GW),tot=W.map(minsOn),max=Math.max(S.goal,...tot,1),wt=sum(tot,x=>x),
 past=W.filter(d=>d<=td()).length||1,avg=Math.round(wt/past),sel=bySubj(GD),st=minsOn(GD),
 f=d=>new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'}),DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
 const diff=st-minsOn(prevDay(GD));
 let a=0;const grad=st?sel.map(([s,m])=>{const g=`${col(s)} ${a/st*360}deg ${(a+m)/st*360}deg`;a+=m;return g}).join(','):'#1a2438 0deg 360deg';
 return `<div class="card"><h3>📊 Study time (weekly)</h3>
 <div class="row between"><button class="x" onclick="wk(-1)">◀</button><div style="text-align:center"><b>${GW===0?'This week':GW===-1?'Last week':f(W[0])+' – '+f(W[6])}</b><div class="mut">Total ${fm(wt)} · Avg ${fm(avg)}/day</div></div><button class="x" onclick="wk(1)" style="${GW>=0?'opacity:.25':''}">▶</button></div>
 <div class="chart"><div class="goal" style="bottom:${S.goal/max*100}%"><span>Goal ${fm(S.goal)}</span></div>
 ${W.map((d,i)=>`<div class="col ${d===GD?'sel':''}" onclick="pick('${d}')"><div class="stack" style="height:${tot[i]/max*100}%">${bySubj(d).map(([s,m])=>`<i style="height:${m/tot[i]*100}%;background:${col(s)}"></i>`).join('')}</div></div>`).join('')}</div>
 <div class="labels">${W.map((d,i)=>`<small class="${d===GD?'on':''}" onclick="pick('${d}')">${DN[i]}</small>`).join('')}</div>
 <div style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px">
 <b>${longDate(GD)}</b>
 <div class="row" style="gap:16px;margin-top:12px"><div class="donut" style="background:conic-gradient(${grad})"><div>${fm(st)}</div></div>
 <div style="flex:1">${sel.length?sel.map(([s,m])=>`<div class="row between" style="font-size:14px;margin-bottom:7px"><span><span class="dot" style="background:${col(s)}"></span>${esc(s)}</span><span>${fm(m)} <span class="mut">${Math.round(m/st*100)}%</span></span></div>`).join(''):'<div class="mut">No study on this day.</div>'}</div></div>
 <div class="mut" style="margin-top:10px">${diff>0?`▲ ${fm(diff)} more than the day before 🔥`:diff<0?`▼ ${fm(-diff)} less than the day before`:'Same as the day before'}</div>
 </div></div>`}

function sSum(days){const set=new Set(days),PD=days.filter(d=>d<=td()),T=sum(PD,minsOn),studied=PD.filter(d=>minsOn(d)>0),hit=PD.filter(d=>S.goal>0&&minsOn(d)>=S.goal).length;
 if(!T)return '<div class="mut" style="margin-top:12px">No study in this period yet.</div>';

 return `<div class="grid2" style="margin-top:12px"><div><div class="mut">TOTAL</div><div class="stat">${fm(T)}</div></div><div><div class="mut">DAYS STUDIED</div><div class="stat">${studied.length}/${PD.length}</div></div><div><div class="mut">AVG / STUDY DAY</div><div class="stat">${fm(Math.round(T/studied.length))}</div></div><div><div class="mut">GOAL HIT</div><div class="stat">${hit} day${hit===1?'':'s'}</div></div></div>
 <div class="mut" style="margin-top:12px">BY SUBJECT</div>${top.map(([s,m])=>`<div style="margin-top:6px"><div class="row between" style="font-size:14px"><span><span class="dot" style="background:${col(s)}"></span>${esc(s)}</span><span>${fm(m)} <span class="mut">${Math.round(m/T*100)}%</span></span></div><div class="bar"><i style="width:${m/top[0][1]*100}%;background:${col(s)}"></i></div></div>`).join('')}`}
function sDetail(){const d=SD,m=minsOn(d),past=d<=td(),list=S.sessions.filter(s=>s.date===d),sel=bySubj(d),diff=m-minsOn(prevDay(d));
 return `<div style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px">
 <div class="row between"><button class="x" onclick="sDay(-1)">◀</button><div style="text-align:center"><b>${longDate(d)}</b><div class="mut">${past?`${fm(m)} studied${S.goal?` · ${Math.round(m/S.goal*100)}% of goal`:''}`:'Future day'}</div></div><button class="x" onclick="sDay(1)" style="${d>=td()?'opacity:.25':''}">▶</button></div>
 ${sel.length?`<div class="bar" style="margin-top:10px;display:flex">${sel.map(([s,x])=>`<i style="width:${x/m*100}%;background:${col(s)}"></i>`).join('')}</div>`:''}
 ${sel.map(([s,x])=>{const tp=[...new Set(list.filter(z=>z.subj===s&&z.topic).map(z=>z.topic))];return `<div style="margin-top:12px"><div class="row between"><b><span class="dot" style="background:${col(s)}"></span>${esc(s)}</b><span>${fm(x)}</span></div>${tp.length?`<div style="margin:4px 0 0 16px;font-size:13px;color:#cbd5e1">📖 ${tp.map(esc).join('<br>📖 ')}</div>`:'<div class="mut" style="margin-left:16px">No topic noted</div>'}</div>`}).join('')}
 ${list.length?`<div class="mut" style="margin-top:14px">SESSIONS</div>${list.map(s=>`<div class="li"><div>${esc(s.subj)}${s.topic?` <span class="mut">· ${esc(s.topic)}</span>`:''}<div class="mut">${s.at?'ended '+s.at:'added manually'}</div></div><b>${fm(s.mins)}</b></div>`).join('')}`:(past?'<div class="mut" style="margin-top:10px">Nothing studied this day.</div>':'')}
 ${past&&(m||minsOn(prevDay(d)))?`<div class="mut" style="margin-top:8px">${diff>0?`▲ ${fm(diff)} more than the day before 🔥`:diff<0?`▼ ${fm(-diff)} less than the day before`:'Same as the day before'}</div>`:''}
 </div>`}
function smap(){const p=periodDays(SV,SO);return `<div class="card"><h3>🔥 Study heatmap</h3>${viewBtns(SV,'sView')}

 ${gridView(SV,p,sColor,d=>{const m=minsOn(d);return m&&d<=td()?short(m):''},'sPick',SD)}

 ${sSum(p.days)}${sDetail()}</div>`}

/* ---------- MONEY ---------- */
const CE=['Food','Groceries','Transport','Fuel','Shopping','Bills','Rent','Recharge','Education','Health','Entertainment','Gifts','Other'];
const CI=['Salary','Pocket money','Refund','Interest','Freelance','Other'],NOSPEND=['Debt repay','Investment'];
const accName=id=>S.acc.find(a=>a.id===id)?.name||'—';
const accOpts=(f=()=>true,sel)=>S.acc.filter(f).map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)}</option>`).join('');
function bal(a){let i=0,o=0;S.tx.forEach(t=>{if(t.type==='exp'&&t.acc===a.id)o+=t.amt;if(t.type==='inc'&&t.acc===a.id)i+=t.amt;if(t.type==='xfer'){if(t.acc===a.id)o+=t.amt;if(t.to===a.id)i+=t.amt}});return a.type==='card'?(+a.open||0)+o-i:(+a.open||0)+i-o}
const debtLeft=d=>d.amt-sum(d.paid,p=>p.amt);
const daysLeft=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate()+1};
function pMoney(){const T=[['over','Overview'],['add','+ Add'],['hist','History'],['debt','Borrowed'],['fix','Fixed'],['inv','Invest'],['acc','Accounts']];
 return `<div class="tabs">${T.map(([k,n])=>`<button class="${MT===k?'':'g'}" onclick="MT='${k}';render()">${n}</button>`).join('')}</div>`+{over:mOver,add:mAdd,hist:mHist,debt:mDebt,fix:mFix,inv:mInv,acc:mAcc}[MT]()}
function mOver(){const B=S.acc.filter(a=>a.type==='bank'),C=S.acc.filter(a=>a.type==='card');
 const cash=sum(B,bal),due=sum(C,bal),debt=sum(S.debts,debtLeft),inv=sum(S.inv,x=>+x.cur||0),nw=cash+inv-due-debt;
 const E=S.tx.filter(t=>t.type==='exp'&&!NOSPEND.includes(t.cat)),tS=sum(E.filter(t=>t.date===td()),t=>t.amt),mE=E.filter(t=>t.date.startsWith(mo())),mS=sum(mE,t=>t.amt);
 const mI=sum(S.tx.filter(t=>t.type==='inc'&&t.cat!=='Borrowed'&&t.date.startsWith(mo())),t=>t.amt);
 const cat={};mE.forEach(t=>cat[t.cat]=(cat[t.cat]||0)+t.amt);const top=Object.entries(cat).sort((a,b)=>b[1]-a[1]);
 const unpaid=S.fixed.filter(f=>!(f.paid||{})[mo()]);
 return `<div class="card"><div class="mut">NET WORTH</div><div class="stat ${nw<0?'neg':''}" style="font-size:30px">${R(nw)}</div><div class="mut">Banks ${R(cash)} + Invest ${R(inv)} − Card ${R(due)} − Owed ${R(debt)}</div></div>
 <div class="grid2"><div class="card"><div class="mut">SPENT TODAY</div><div class="stat">${R(tS)}</div></div><div class="card"><div class="mut">THIS MONTH</div><div class="stat">${R(mS)}</div><div class="mut">Income ${R(mI)}</div></div></div>
 ${S.budget>0?`<div class="card"><div class="row between"><b>Monthly budget</b><span class="${mS>S.budget?'neg':''}">${R(mS)} / ${R(S.budget)}</span></div><div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,mS/S.budget*100)}%;background:${mS>S.budget?'var(--bad)':mS>S.budget*.8?'var(--warn)':'var(--ok)'}"></i></div><div class="mut" style="margin-top:6px">${mS>S.budget?'Over budget! Freeze non-essentials.':`${R(S.budget-mS)} left · about ${R((S.budget-mS)/daysLeft())}/day`}</div></div>`:''}
 <div class="card"><h3>Accounts</h3>${S.acc.map(a=>`<div class="li"><div>${a.type==='card'?'💳':'🏦'} ${esc(a.name)}${a.type==='card'&&a.limit?`<div class="mut">Limit ${R(a.limit)} · Available ${R(a.limit-bal(a))}</div>`:''}</div><b class="${a.type==='card'&&bal(a)>0?'neg':''}">${a.type==='card'?'Due '+R(bal(a)):R(bal(a))}</b></div>`).join('')}</div>
 ${unpaid.length?`<div class="card" style="border-color:var(--warn)"><h3>⚠ Fixed expenses unpaid this month</h3>${unpaid.map(f=>`<div class="li"><span>${esc(f.name)} <span class="mut">day ${f.day}</span></span><b>${R(f.amt)}</b></div>`).join('')}</div>`:''}
 <div class="card"><h3>Where money went (this month)</h3>${top.length?top.map(([c,a])=>`<div style="margin-bottom:8px"><div class="row between" style="font-size:14px"><span>${esc(c)}</span><span>${R(a)}</span></div><div class="bar"><i style="width:${a/top[0][1]*100}%"></i></div></div>`).join(''):'<div class="mut">No expenses yet.</div>'}</div>`}
function mAdd(){return `<div class="card"><h3>Add transaction</h3>

function mHist(){const L=S.tx.filter(t=>t.date.startsWith(HM)).sort((a,b)=>b.date.localeCompare(a.date));

 ${L.length?L.map(t=>`<div class="li"><div><div>${t.type==='xfer'?'🔁 '+esc(accName(t.acc))+' → '+esc(accName(t.to)):esc(t.cat)}${t.note?' · '+esc(t.note):''}</div><div class="mut">${t.date}${t.type==='xfer'?'':' · '+esc(accName(t.acc))}</div></div><div class="row"><b class="${t.type==='exp'?'neg':t.type==='inc'?'pos':''}">${t.type==='exp'?'−':t.type==='inc'?'+':''}${R(t.amt)}</b><button class="x" onclick="delTx('${t.id}')">✕</button></div></div>`).join(''):'<div class="mut">Nothing this month.</div>'}</div>`}

function mDebt(){return `<div class="card"><div class="mut">TOTAL YOU STILL OWE</div><div class="stat neg">${R(sum(S.debts,debtLeft))}</div></div>
 <div class="card"><h3>Add borrowed money</h3><input id="dp" placeholder="From whom? (e.g. Mama ji)"><input id="da" type="number" inputmode="decimal" placeholder="Amount ₹">

 ${S.debts.map(d=>{const l=debtLeft(d),p=d.amt-l;return `<div class="card"><div class="row between"><b>${esc(d.person)}</b><button class="x" onclick="delDebt('${d.id}')">✕</button></div><div class="mut">${d.date}${d.note?' · '+esc(d.note):''}</div>
 <div class="row between" style="margin:8px 0;font-size:14px"><span>Repaid ${R(p)} of ${R(d.amt)}</span><b class="${l>0?'neg':'pos'}">${l>0?R(l)+' left':'Cleared ✓'}</b></div><div class="bar"><i style="width:${p/d.amt*100}%;background:var(--ok)"></i></div>

function addDebt(){const amt=+$('da').value,person=v('dp');if(!person||!(amt>0))return alert('Enter name and amount');const d={id:uid(),person,amt,acc:$('dac').value,date:$('dd').value||td(),note:v('dn'),paid:[]};
 if(d.acc)S.tx.push({id:uid(),type:'inc',amt,acc:d.acc,cat:'Borrowed',note:'From '+person,date:d.date});S.debts.push(d);save();toast('Added');render()}
function repay(id){const d=S.debts.find(x=>x.id===id),acc=d.acc||S.acc.find(x=>x.type==='bank')?.id;const a=+prompt(`How much did you repay ${d.person}?\nLeft: ${R(debtLeft(d))}\n(Will be deducted from ${accName(acc)})`);if(!(a>0))return;
 const tid=uid();S.tx.push({id:tid,type:'exp',amt:a,acc,cat:'Debt repay',note:'To '+d.person,date:td()});d.paid.push({amt:a,date:td(),tid});save();toast('Repayment saved 💪');render()}
function delDebt(id){if(confirm('Delete this record?')){S.debts=S.debts.filter(d=>d.id!==id);save();render()}}
function mFix(){const m=mo();return `<div class="card"><div class="mut">FIXED PER MONTH</div><div class="stat">${R(sum(S.fixed,f=>f.amt))}</div><div class="mut">Paid this month: ${R(sum(S.fixed.filter(f=>(f.paid||{})[m]),f=>f.amt))}</div></div>
 <div class="card"><h3>Add fixed expense</h3><input id="fn" placeholder="Rent, WiFi, EMI, Gym, Netflix..."><input id="fa" type="number" inputmode="decimal" placeholder="Amount ₹"><input id="fd" type="number" inputmode="numeric" placeholder="Due day of month (1-31)"><div class="mut">Paid from</div><select id="fac">${accOpts()}</select><button style="width:100%" onclick="addFix()">Add</button></div>
 <div class="card"><h3>This month</h3>${S.fixed.length?S.fixed.sort((a,b)=>a.day-b.day).map(f=>{const p=(f.paid||{})[m];return `<div class="li"><div><div>${esc(f.name)} · ${R(f.amt)}</div><div class="mut">Day ${f.day} · ${esc(accName(f.acc))}</div></div><div class="row"><button class="${p?'':'g'}" style="padding:8px 10px;font-size:13px;${p?'background:var(--ok)':''}" onclick="payFix('${f.id}')">${p?'Paid ✓':'Mark paid'}</button><button class="x" onclick="delFix('${f.id}')">✕</button></div></div>`}).join(''):'<div class="mut">No fixed expenses yet.</div>'}</div>`}
function addFix(){const name=v('fn'),amt=+$('fa').value;if(!name||!(amt>0))return alert('Enter name and amount');S.fixed.push({id:uid(),name,amt,day:Math.min(31,Math.max(1,+$('fd').value||1)),acc:$('fac').value,paid:{}});save();render()}
function payFix(id){const f=S.fixed.find(x=>x.id===id),m=mo();f.paid=f.paid||{};
 if(f.paid[m]){if(!confirm('Undo payment?'))return;S.tx=S.tx.filter(t=>t.id!==f.paid[m]);delete f.paid[m]}
 else{const tid=uid();S.tx.push({id:tid,type:'exp',amt:f.amt,acc:f.acc,cat:'Bills',note:f.name,date:td()});f.paid[m]=tid;toast('Paid ✓')}save();render()}
function delFix(id){if(confirm('Remove this fixed expense?')){S.fixed=S.fixed.filter(f=>f.id!==id);save();render()}}
function mInv(){const ti=sum(S.inv,x=>x.amt),tc=sum(S.inv,x=>x.cur),pl=tc-ti;
 return `<div class="card"><div class="mut">PORTFOLIO VALUE</div><div class="stat">${R(tc)}</div><div class="${pl<0?'neg':'pos'}">${pl>=0?'+':''}${R(pl)} ${ti?`(${(pl/ti*100).toFixed(1)}%)`:''}</div><div class="mut">Invested ${R(ti)}</div></div>
 <div class="card"><h3>Add investment</h3><input id="in" placeholder="Name (e.g. Nifty 50 SIP)"><select id="it">${['SIP / Mutual fund','Stocks','FD / RD','Gold','PPF / NPS','Crypto','Other'].map(x=>`<option>${x}</option>`).join('')}</select>
 <input id="ia" type="number" inputmode="decimal" placeholder="Amount invested ₹"><input id="ic" type="number" inputmode="decimal" placeholder="Current value ₹ (blank = same)">
 <div class="mut">Paid from (deducts bank balance)</div><select id="iac"><option value="">Already invested earlier (don't deduct)</option>${accOpts(a=>a.type==='bank')}</select><button style="width:100%" onclick="addInv()">Add</button></div>
 ${S.inv.map(x=>{const g=x.cur-x.amt;return `<div class="card"><div class="row between"><div><b>${esc(x.name)}</b><div class="mut">${esc(x.type)}</div></div><button class="x" onclick="delInv('${x.id}')">✕</button></div>
 <div class="row between" style="margin:8px 0;font-size:14px"><span>Invested ${R(x.amt)}</span><b>${R(x.cur)} <span class="${g<0?'neg':'pos'}">(${g>=0?'+':''}${R(g)})</span></b></div>
 <div class="row"><button class="g" style="flex:1;font-size:13px" onclick="invAdd('${x.id}')">+ Invest more</button><button class="g" style="flex:1;font-size:13px" onclick="invUpd('${x.id}')">Update value</button></div></div>`}).join('')}`}
function addInv(){const name=v('in'),amt=+$('ia').value;if(!name||!(amt>0))return alert('Enter name and amount');const acc=$('iac').value;
 S.inv.push({id:uid(),name,type:$('it').value,amt,cur:+$('ic').value||amt,acc});if(acc)S.tx.push({id:uid(),type:'exp',amt,acc,cat:'Investment',note:name,date:td()});save();toast('Added 📈');render()}
function invAdd(id){const x=S.inv.find(i=>i.id===id),a=+prompt('Amount invested now ₹');if(!(a>0))return;x.amt+=a;x.cur+=a;if(x.acc)S.tx.push({id:uid(),type:'exp',amt:a,acc:x.acc,cat:'Investment',note:x.name,date:td()});save();render()}
function invUpd(id){const x=S.inv.find(i=>i.id===id),a=prompt('Current value ₹',x.cur);if(a===null||isNaN(+a))return;x.cur=+a;save();render()}
function delInv(id){if(confirm('Delete this investment?')){S.inv=S.inv.filter(i=>i.id!==id);save();render()}}
function mAcc(){return `<div class="card"><h3>Your accounts</h3><div class="mut" style="margin-bottom:10px">Enter each bank's balance on the day you start. For the credit card, enter what you already owe. Everything after that is calculated from your entries.</div>
 ${S.acc.map((a,i)=>`<div style="border-top:1px solid var(--line);padding-top:10px;margin-top:6px"><div class="mut">${a.type==='card'?'💳 Credit card':'🏦 Bank / wallet'}</div><input value="${esc(a.name)}" onchange="S.acc[${i}].name=this.value;save()">
 <div class="grid2"><div><div class="mut">${a.type==='card'?'Already owed':'Starting balance'}</div><input type="number" value="${a.open}" onchange="S.acc[${i}].open=+this.value;save();toast('Saved')"></div>${a.type==='card'?`<div><div class="mut">Credit limit</div><input type="number" value="${a.limit||0}" onchange="S.acc[${i}].limit=+this.value;save();toast('Saved')"></div>`:''}</div></div>`).join('')}</div>
 <div class="card"><h3>Add account</h3><input id="an" placeholder="Name (e.g. Cash, Paytm)"><select id="aty"><option value="bank">Bank / Wallet / Cash</option><option value="card">Credit card</option></select><button style="width:100%" onclick="addAcc()">Add</button></div>
 <div class="card"><h3>Monthly spending budget</h3><input type="number" value="${S.budget||''}" placeholder="e.g. 8000" onchange="S.budget=+this.value;save();toast('Budget saved')"></div>`}
function addAcc(){const n=v('an');if(!n)return;S.acc.push({id:uid(),name:n,type:$('aty').value,open:0,limit:0});save();render()}

/* ---------- MORE ---------- */
function pMore(){return `<div class="card"><h3>☁ Cloud sync (phone ↔ laptop)</h3>${SY.url?`<div class="row between"><span>Connected to Google Drive</span><span class="mut">${syncState}</span></div><div class="mut" style="margin-top:6px">Changes upload automatically. Data is pulled every time you open the app.</div><div class="row" style="margin-top:10px"><button style="flex:1" onclick="pull()">🔄 Sync now</button><button class="g" style="flex:1" onclick="disc()">Disconnect</button></div>`
 :`<div class="mut" style="margin-bottom:10px">Paste your Google Apps Script Web app URL and your PIN.</div><input id="surl" placeholder="https://script.google.com/macros/s/.../exec"><input id="spin" type="password" placeholder="PIN"><button style="width:100%" onclick="connect()">Connect</button>`}</div>
 <div class="card"><h3>Winter Arc settings</h3><div class="mut">Start date</div><input id="sd" type="date" value="${S.start}"><div class="mut">Arc length (days)</div><input id="sdy" type="number" value="${S.days}"><div class="mut">Daily study goal (minutes)</div><input id="sg" type="number" value="${S.goal}"><button style="width:100%" onclick="saveSet()">Save</button></div>
 <div class="card"><h3>Backup file</h3><div class="mut" style="margin-bottom:10px">Extra safety: download a backup now and then and keep it in Google Drive.</div>
 <div class="row"><button style="flex:1" onclick="exportD()">⬇ Export</button><label style="flex:1"><span class="btnlike">⬆ Import</span><input type="file" accept=".json" hidden onchange="importD(this.files[0])"></label></div></div>
 <div class="card"><h3>Danger zone</h3><button class="r" style="width:100%" onclick="if(confirm('Delete ALL data on this device?')&&confirm('Really? If sync is on, cloud data will download again on reopen.')){localStorage.removeItem(K);location.reload()}">Reset this device</button></div>`}
function saveSet(){S.start=$('sd').value||td();S.days=+v('sdy')||90;S.goal=+v('sg')||240;save();toast('Saved');render()}
function exportD(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download=`winter-arc-backup-${td()}.json`;a.click()}
function importD(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(structuredClone(DEF),JSON.parse(r.result));save();render();alert('Restored!')}catch(e){alert('Invalid backup file')}};r.readAsText(f)}

/* ---------- CORE ---------- */
function render(){head();$('app').innerHTML={arc:pArc,study:pStudy,money:pMoney,more:pMore}[P]();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===P));$('nst').textContent=S.timer.run?'🔴':'⏱';setSync(syncState)}
setInterval(()=>{const ms=el();if(S.timer.pomo&&S.timer.run&&ms>=25*60000){stopT(true);beep();setTimeout(()=>alert('🍅 Pomodoro done! Take a 5 minute break.'),100);return}
 const t=$('tm');if(t)t.textContent=hms(S.timer.pomo?Math.max(0,25*60000-ms):ms)},500);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(S.timer.run)lock();render();pull()}});
render();pull();
</script></body></html>
